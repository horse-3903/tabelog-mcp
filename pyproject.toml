[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tabelog-mcp"
version = "0.0.1"
description = "Unofficial Tabelog MCP server (experimental, untested)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "requests>=2.31"]

[project.scripts]
tabelog-mcp = "tabelog_mcp.server:main"

[tool.setuptools]
packages = ["tabelog_mcp"]
